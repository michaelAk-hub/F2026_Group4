<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Violations - Smart Parking</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Administrator">
      <div class="brand-name">
        <span class="logo">P</span>
        <span>SMART PARKING<small>ADMINISTRATOR</small></span>
      </div>
      <ul class="menu-links">
        <li><a href="admin.html">Admin</a></li>
        <li><a href="admin-sensors.html">Sensors</a></li>
        <li><a href="admin-violations.html" class="active" aria-current="page">Violations</a></li>
        <li><a href="login.html" onclick="logout(); return false;">Logout</a></li>
      </ul>
    </nav>

    <main class="content">
      <h1>Violations Review</h1>

      <section class="box" aria-labelledby="open-violations-title">
        <h2 id="open-violations-title" tabindex="-1">Open violations</h2>
        <p id="violations-status" role="status">Loading violations…</p>
        <button id="retry-violations" class="filter-btn" type="button" hidden>Retry</button>

        <table id="violations-table" aria-labelledby="open-violations-title" hidden>
          <thead>
            <tr>
              <th scope="col">Parking spot</th>
              <th scope="col">Violation</th>
              <th scope="col">Date</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="violations-list"></tbody>
        </table>
      </section>

      <section id="violation-review" class="box" aria-labelledby="review-title" hidden>
        <h2 id="review-title">Review violation</h2>
        <p id="review-details"></p>

        <form id="violation-review-form">
          <div class="field">
            <label for="violation-note">Review note</label>
            <textarea id="violation-note" rows="3" maxlength="500" required></textarea>
          </div>

          <p id="violation-review-error" class="error" role="alert"></p>
          <button class="btn" type="submit" value="Resolved">Resolve</button>
          <button class="filter-btn" type="submit" value="Dismissed">Dismiss</button>
          <button id="cancel-review" class="filter-btn" type="button">Cancel</button>
        </form>
      </section>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin-violations.js"></script>
</body>
</html>

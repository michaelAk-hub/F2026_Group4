<!DOCTYPE html>
<!-- Profile page - Stefania (Week 5) -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - Smart Parking</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand-name"><span class="logo">P</span><span>SMART PARKING<small>MANAGEMENT SYSTEM</small></span></div>
      <ul class="menu-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="reservation.html">Reserve</a></li>
        <li><a href="my-reservations.html">My Reservations</a></li>
        <li><a href="profile.html" class="active">Profile</a></li>
        <li><a href="login.html" onclick="logout(); return false;">Logout</a></li>
      </ul>
    </nav>

    <main class="content">
      <h1>My Profile</h1>
      <p class="subtitle">Your personal and payment details</p>

      <form id="profile-form" novalidate>
        <div class="two-columns">
          <section class="box">
            <h2>Personal details</h2>
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" type="text">
              <p class="error" data-for="name"></p>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email">
              <p class="error" data-for="email"></p>
            </div>
            <div class="field">
              <label for="carNumber">Car number</label>
              <input id="carNumber" type="text" placeholder="ABC 123">
              <p class="error" data-for="carNumber"></p>
            </div>
          </section>

          <section class="box">
            <h2>Payment details</h2>
            <div class="field">
              <label for="paymentMethod">Payment method (optional)</label>
              <input id="paymentMethod" type="text" placeholder="Visa ending 4242">
              <p class="error" data-for="paymentMethod"></p>
            </div>
            <p class="note">Write only a short name, for example "Visa ending 4242".
              We never save your card number.</p>
          </section>
        </div>

        <div class="profile-buttons">
          <button class="btn" id="save-profile" type="submit">SAVE CHANGES</button>
        </div>
      </form>
    </main>
  </div>

  <!-- the toasts (small messages) appear here -->
  <div class="toast-area" id="toast-area" aria-live="polite"></div>

  <!-- only a logged in driver can stay on this page -->
  <script src="js/auth.js"></script>
  <script>
    requireRole("driver");
  </script>

  <script src="js/api.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/profile.js"></script>
  <script>
    setupProfile();
  </script>
</body>
</html>
